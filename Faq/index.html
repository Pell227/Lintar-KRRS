<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FAQ & Bantuan - Lintar KRRS</title>

    <link rel="stylesheet" href="../sidebar/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"/>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"/>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <nav class="site-nav">
      <button class="sidebar-toggle">
        <span class="matsym">
          <i class="fa-solid fa-bars"></i>
        </span>
      </button>
    </nav>

    <div class="container">

    <div id="sidebar-container">
        <div class="sidebar-loading"></div>
    </div>

      <div class="main-content">

        <div class="borderhead">

          <i class="fa-solid fa-circle-question"></i>

          <h1 class="page-title">
            FAQ & Bantuan
          </h1>

        </div>

        <div class="card">

          <div class="information">

            <h2>
              Pertanyaan yang Sering Diajukan
            </h2>

            <p class="section-description">
              Temukan jawaban atas pertanyaan umum
              mengenai sistem Lintar KRRS.
            </p>

            <div
              id="faqContainer"
              class="faq-container"
            >

            </div>

          </div>

        </div>

        <div class="card">

          <div class="information">

            <h2>
              Kontak Dosen Wali
            </h2>

            <p class="section-description">
              Informasi dosen wali mahasiswa.
            </p>

            <div class="lecturer-card">

              <div class="lecturer-photo">

                <i class="fa-solid fa-user"></i>

              </div>

              <div class="lecturer-info">

                <h3 id="dosenNama">
                  -
                </h3>

                <p
                  id="dosenJabatan"
                  class="lecturer-role"
                >
                  -
                </p>

                <div class="contact-list">

                  <div class="contact-item">

                    <i class="fa-solid fa-envelope"></i>

                    <div>

                      <span>Email</span>

                      <strong id="dosenEmail">
                        -
                      </strong>

                    </div>

                  </div>

                  <div class="contact-item">

                    <i class="fa-solid fa-phone"></i>

                    <div>

                      <span>Telepon</span>

                      <strong id="dosenTelepon">
                        -
                      </strong>

                    </div>

                  </div>

                  <div class="contact-item">

                    <i class="fa-solid fa-building"></i>

                    <div>

                      <span>Ruangan</span>

                      <strong id="dosenRuangan">
                        -
                      </strong>

                    </div>

                  </div>


                </div>

              </div>

            </div>

          </div>

        </div>


      </div>

    </div>

    <script src="script.js"></script>

    <script src="../sidebar/app.js"></script>

    <script>

      fetch("../sidebar/index.html")
  .then((response) => response.text())
  .then((data) => {

    document.getElementById("sidebar-container").innerHTML = data;

    const menuLinks =
      document.querySelectorAll("#sidebar-container .menu-link");

    menuLinks.forEach((link) => {

      link.classList.remove("active");

      const label =
        link.querySelector(".menu-label");

      if (
        label &&
        label.textContent.trim().toLowerCase() === "faq"
      ) {
        link.classList.add("active");
      }

    });

    if (typeof initside === "function") {
      initside();
    }

  })
  .catch((error) => {

    console.error(
      "Gagal memuat sidebar:",
      error
    );

  });

    </script>
  </body>
</html>
