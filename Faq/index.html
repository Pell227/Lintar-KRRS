<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAQ & Bantuan - Lintar KRRS</title>

    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="header-logo">
            <i class="bi bi-mortarboard-fill"></i>

            <span>Lintar KRRS</span>
        </div>

        <div class="header-user">

            <i class="bi bi-bell"></i>

            <div class="user-profile">
                <i class="bi bi-person-circle"></i>

                <span>Mahasiswa</span>
            </div>

        </div>

    </header>

    <main class="main-content">

        <div class="breadcrumb">

            <i class="bi bi-house-fill"></i>

            <span>Home</span>

            <i class="bi bi-chevron-right"></i>

            <span>FAQ & Bantuan</span>

        </div>

        <section class="page-heading">

            <h1>FAQ & Bantuan</h1>

            <p>
                Temukan jawaban atas pertanyaan umum mengenai
                sistem Lintar KRRS.
            </p>

        </section>

        <section class="content-card">

            <div class="section-heading">

                <div class="section-icon">
                    <i class="bi bi-question-lg"></i>
                </div>

                <div>

                    <h2>Pertanyaan yang Sering Diajukan</h2>

                    <p>
                        Klik pertanyaan untuk melihat jawabannya.
                    </p>

                </div>

            </div>

            <div id="faqContainer" class="faq-container"></div>

        </section>

        <section class="content-card">

            <div class="section-heading">

                <div class="section-icon">
                    <i class="bi bi-person-vcard-fill"></i>
                </div>

                <div>

                    <h2>Kontak Dosen Wali</h2>

                    <p>
                        Informasi dosen wali mahasiswa.
                    </p>

                </div>

            </div>


            <div class="lecturer-card">

                <div class="lecturer-photo">

                    <i class="bi bi-person-fill"></i>

                </div>

                <div class="lecturer-info">

                    <h3 id="dosenNama">
                        -
                    </h3>

                    <p id="dosenJabatan" class="lecturer-role">
                        -
                    </p>


                    <div class="contact-list">

                        <div class="contact-item">

                            <i class="bi bi-envelope-fill"></i>

                            <div>

                                <span>Email</span>

                                <strong id="dosenEmail">
                                    -
                                </strong>

                            </div>

                        </div>


                        <div class="contact-item">

                            <i class="bi bi-telephone-fill"></i>

                            <div>

                                <span>Telepon</span>

                                <strong id="dosenTelepon">
                                    -
                                </strong>

                            </div>

                        </div>


                        <div class="contact-item">

                            <i class="bi bi-building-fill"></i>

                            <div>

                                <span>Ruangan</span>

                                <strong id="dosenRuangan">
                                    -
                                </strong>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
