<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pengumuman - Lintar KRRS</title>

    <link rel="stylesheet" href="../sidebar/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    
  </head>

  <body>

    <nav class="site-nav">

      <button class="sidebar-toggle">

        <span class="matsym">
          <i class="fa-solid fa-bars"></i>
        </span>

      </button>

    </nav>

    <div class="container">

      <div id="sidebar-container"></div>

      <div class="main-content">

        <div class="borderhead">

          <i class="fa-solid fa-bullhorn"></i>

          <h1 class="page-title">
            Pengumuman
          </h1>

        </div>

        <div class="card">

          <div class="information">

            <h2>
              Berita Akademik
            </h2>

            <p class="section-description">
              Informasi terbaru mengenai kegiatan dan
              layanan akademik mahasiswa.
            </p>

          </div>

        </div>

        <div
          class="announcement-container"
          id="announcementContainer"
        >

        </div>

        <div
          class="announcement-modal"
          id="announcementModal"
        >

          <div class="announcement-detail">

            <button
              class="close-modal"
              onclick="closeAnnouncement()"
              aria-label="Tutup"
            >

              <i class="fa-solid fa-xmark"></i>

            </button>

            <div class="detail-icon">

              <i class="fa-solid fa-bullhorn"></i>

            </div>

            <div class="detail-content">

              <div class="detail-top">

                <span
                  class="announcement-category"
                  id="detailCategory"
                ></span>

                <span
                  class="announcement-date"
                  id="detailDate"
                ></span>

              </div>


              <h2 id="detailTitle"></h2>


              <p id="detailContent"></p>


              <button
                class="close-button"
                onclick="closeAnnouncement()"
              >
                Tutup
              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

    <script src="../data.js"></script>
    <script src="script.js"></script>
    <script src="../sidebar/app.js"></script>

    <script>

      fetch("../sidebar/index.html")

        .then((response) => response.text())

        .then((data) => {

          document.getElementById(
            "sidebar-container"
          ).innerHTML = data;

          const menuLinks =
            document.querySelectorAll(
              "#sidebar-container .menu-link"
            );


          menuLinks.forEach((link) => {

            link.classList.remove("active");


            const label =
              link.querySelector(".menu-label");


            if (
              label &&
              label.textContent
                .trim()
                .toLowerCase() === "pengumuman"
            ) {

              link.classList.add("active");

            }

          });

          if (typeof initside === "function") {

            initside();

          }

        })

        .catch((error) => {

          console.error(
            "Gagal memuat sidebar:",
            error
          );

        });

    </script>

  </body>
</html>
